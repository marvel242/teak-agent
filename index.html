<meta name="apple-mobile-web-app-title" content="TEAk">
<meta name="theme-color" content="#052e22">
<meta name="description" content="TEAk, agente IA vocale du Congo Brazzaville. Parle-lui au micro, en français et en lingala.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#fff; overflow:hidden;
    background: linear-gradient(160deg,#052e22 0%,#0a5c36 28%,#0e7a5f 48%,#b3541e 78%,#3b1054 100%);
    background-size: 200% 200%;
    animation: fond 18s ease-in-out infinite alternate;
  }
  @keyframes fond { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
  body::before {
    content:""; position:fixed; inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 88%, rgba(255,170,60,.35), transparent 70%),
      radial-gradient(ellipse 50% 35% at 20% 15%, rgba(0,255,180,.18), transparent 70%),
      radial-gradient(ellipse 45% 30% at 85% 20%, rgba(120,80,255,.22), transparent 70%);
    pointer-events:none;
  }
  #app { position:relative; height:100dvh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; display:flex; justify-content:space-between; align-items:center; padding:14px 16px; z-index:5; }
  #statut { font-size:13px; opacity:.9; display:flex; align-items:center; gap:7px; }
  #statut .dot { width:9px; height:9px; border-radius:50%; background:#e8e8e8; box-shadow:0 0 8px rgba(255,255,255,.7); transition:background .3s, box-shadow .3s; }
  body.parle #statut .dot { background:#ff3b30; box-shadow:0 0 12px #ff3b30; }
  body.ecoute #statut .dot { background:#2ee66b; box-shadow:0 0 12px #2ee66b; }
  #btnMenu {
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.25); color:#fff; font-size:22px; cursor:pointer; backdrop-filter: blur(6px);
  }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:10px; width:100%; padding-top:2px; }

  /* ===== PERSONNAGE 3D ANIMÉ ===== */
  #scene { display:flex; flex-direction:column; align-items:center; }
  #persoWrap {
    position:relative; width:min(56vw,228px); aspect-ratio: 242 / 324;
    animation: respire 3.6s ease-in-out infinite;
    transform-origin: 50% 85%;
  }
  @keyframes respire { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.015); } }
  body.parle #persoWrap { animation: parleBounce .55s ease-in-out infinite; }
  @keyframes parleBounce { 0%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-3px) rotate(.7deg); } 75% { transform: translateY(1px) rotate(-.7deg); } }
  body.ecoute #persoWrap { animation: ecouteBalance 2.8s ease-in-out infinite; }
  @keyframes ecouteBalance { 0%,100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-1.8deg) translateY(-3px); } }
  #perso {
    width:100%; height:100%; object-fit:contain; display:block; position:relative; z-index:1;
    filter: drop-shadow(0 16px 20px rgba(0,0,0,.35));
    transition: filter .35s;
  }
  #perso.pop { animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.93); opacity:.35; } to { transform: scale(1); opacity:1; } }
  body.parle #perso { filter: drop-shadow(0 0 30px rgba(255,59,48,.55)) drop-shadow(0 16px 20px rgba(0,0,0,.3)); }
  body.ecoute #perso { filter: drop-shadow(0 0 30px rgba(46,230,107,.5)) drop-shadow(0 16px 20px rgba(0,0,0,.3)); }
  /* Paupières : visibles seulement sur l'expression « écoute » */
  .paupiere {
    position:absolute; z-index:2; border-radius:50%; pointer-events:none;
    background: radial-gradient(ellipse at 50% 35%, #b57e4e 0%, #96683c 70%, #7d552f 100%);
    box-shadow: inset 0 -4px 5px rgba(60,35,15,.6);
    transform: scaleY(0); transform-origin: 50% 50%;
    display:none;
  }
  #persoWrap.expr-listening .paupiere { display:block; }
  body.ecoute #persoWrap.expr-listening .paupiere { animation: cligne 3.8s ease-in-out infinite; }
  @keyframes cligne { 0%, 87%, 100% { transform: scaleY(0); } 90.5% { transform: scaleY(1); } 93% { transform: scaleY(0); } 95.5% { transform: scaleY(1); } 98% { transform: scaleY(0); } }
  #paupG { left:48.4%; top:32.5%; width:19%; height:15%; }
  #paupD { left:69.3%; top:29%; width:19%; height:15%; }
  #ombre { width:112px; height:20px; margin-top:2px; border-radius:50%; background:rgba(0,0,0,.35); filter: blur(8px); animation: ombre 3.6s ease-in-out infinite; }
  @keyframes ombre { 0%,100% { transform: scaleX(1); opacity:.8; } 50% { transform: scaleX(.85); opacity:.55; } }

  /* ===== CARTE INFO : montre 3D (heure) / calendrier 3D (date) ===== */
  #carteInfo {
    position:fixed; left:50%; bottom:118px; transform:translateX(-50%) scale(.6);
    z-index:8; display:none; flex-direction:column; align-items:center; gap:2px;
    background:rgba(10,30,22,.55); border:1px solid rgba(255,255,255,.25); border-radius:22px;
    padding:14px 22px 12px; backdrop-filter: blur(8px); box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  #carteInfo.actif { display:flex; animation: cartePop .45s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes cartePop { from { transform:translateX(-50%) scale(.6); opacity:0; } to { transform:translateX(-50%) scale(1); opacity:1; } }
  #carteImgWrap { position:relative; }
  #carteImg { width:104px; height:auto; display:block; filter: drop-shadow(0 10px 14px rgba(0,0,0,.4)); }
  #carteJour {
    position:absolute; left:50%; top:56%; transform:translate(-50%,-50%);
    font-size:44px; font-weight:800; color:#20303a; display:none; text-shadow:0 1px 0 #fff;
  }
  #carteTitre { font-size:26px; font-weight:800; letter-spacing:.5px; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  #carteSous { font-size:13px; opacity:.85; text-transform:capitalize; }
  /* ===== SOURCES WEB ===== */
  #sources { display:none; flex-wrap:wrap; gap:6px; justify-content:center; padding:0 24px; max-width:540px; }
  #sources.actif { display:flex; }
  #sources .srcLabel { font-size:12px; opacity:.8; width:100%; text-align:center; }
  #sources a {
    font-size:12px; color:#ffe9a8; text-decoration:none; background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.3); padding:4px 10px; border-radius:999px;
  }
  #invite { font-size:17px; font-weight:600; text-shadow:0 2px 10px rgba(0,0,0,.4); padding:0 24px; text-align:center; min-height:24px; }
  #transcription { font-size:14px; opacity:.9; padding:0 28px; text-align:center; max-width:520px; min-height:20px; font-style:italic; }

  /* ===== PETIT BOUTON BAS : rouge = TEAk parle, vert = à toi ===== */
  #zoneBouton { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:7px; padding-bottom:6px; }
  #btnParole {
    width:68px; height:68px; border-radius:50%; cursor:pointer;
    border:2px solid rgba(255,255,255,.4); background:rgba(0,0,0,.35); backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  #point {
    width:26px; height:26px; border-radius:50%; background:#e8e8e8;
    box-shadow: 0 0 10px rgba(255,255,255,.6); transition: background .3s, box-shadow .3s;
    animation: pointCalme 2.6s ease-in-out infinite;
  }
  @keyframes pointCalme { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  body.parle #point { background:#ff3b30; box-shadow:0 0 22px #ff3b30, 0 0 44px rgba(255,59,48,.6); animation: pointPulse .8s ease-in-out infinite; }
  body.ecoute #point { background:#2ee66b; box-shadow:0 0 22px #2ee66b, 0 0 44px rgba(46,230,107,.6); animation: pointPulse 1.1s ease-in-out infinite; }
  @keyframes pointPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  #etatBouton { font-size:13px; opacity:.9; text-shadow:0 1px 6px rgba(0,0,0,.5); min-height:16px; }
  body.parle #etatBouton { color:#ffb3ae; }
  body.ecoute #etatBouton { color:#b9ffd0; }

  #btnEcrire {
    background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.3); color:#fff;
    padding:8px 16px; border-radius:999px; font-size:13px; cursor:pointer; backdrop-filter: blur(6px); margin-bottom:14px;
  }
  #zoneTexte { display:none; width:min(92vw,520px); gap:8px; margin-bottom:18px; }
  #zoneTexte.actif { display:flex; }
  #champTexte { flex:1; padding:12px 14px; border-radius:14px; border:none; font-size:15px; }
  #btnEnvoyer { padding:12px 16px; border-radius:14px; border:none; background:#16a34a; color:#fff; font-weight:700; cursor:pointer; }
  /* Menu et panneaux */
  #menu, .panneau {
    position:fixed; inset:0; background:rgba(4,20,14,.72); backdrop-filter: blur(8px);
    display:none; z-index:20; overflow-y:auto; padding:20px 16px 40px;
  }
  #menu.actif, .panneau.actif { display:block; }
  .carte { max-width:560px; margin:0 auto; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:18px; }
  .carte h2 { font-size:19px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .fermer { background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
  .itemMenu {
    display:block; width:100%; text-align:left; padding:15px 14px; margin-bottom:10px;
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.12); border-radius:14px;
    color:#fff; font-size:16px; cursor:pointer;
  }
  .itemMenu small { display:block; opacity:.75; font-size:13px; margin-top:3px; }

  .ligne b { color:#a7f3c9; }
  select, .btnAction {
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25);
    border-radius:10px; padding:9px 12px; font-size:15px; cursor:pointer;
  }
  select option { color:#111; }
  .btnDanger { background:rgba(220,38,38,.35); border-color:rgba(255,120,120,.5); }
  .espace { height:12px; }
  #ajoutMemoire, #ajoutPhrase { display:flex; gap:8px; margin-top:12px; }
  #ajoutMemoire input, #ajoutPhrase input { flex:1; padding:10px; border-radius:10px; border:none; font-size:14px; min-width:0; }

</head>
<body>
<div id="app">
  <header>
    <div id="statut"><span class="dot"></span><span id="statutTexte">TEAk est prête</span></div>
    <button id="btnMenu" aria-label="Autres options">⋯</button>
  </header>
  <main>
    <div id="scene">
      <div id="persoWrap">
        <img id="perso" alt="TEAk, ton agente congolaise">
        <div class="paupiere" id="paupG"></div>
        <div class="paupiere" id="paupD"></div>
      </div>
      <div id="ombre"></div>
    </div>
    <div id="invite">Touche le bouton et parle-moi</div>
    <div id="transcription"></div>
    <div id="sources"></div>
    <div id="zoneBouton">
      <button id="btnParole" aria-label="Démarrer ou arrêter la conversation"><span id="point"></span></button>
      <div id="etatBouton">Touche pour parler</div>
    </div>
    <div id="carteInfo">
      <div id="carteImgWrap"><img id="carteImg" alt=""><div id="carteJour"></div></div>
      <div id="carteTitre"></div>
      <div id="carteSous"></div>
    </div>
    <button id="btnEcrire">Écrire plutôt</button>
    <form id="zoneTexte">
      <input id="champTexte" type="text" placeholder="Écris ton message à TEAk…" autocomplete="off">
      <button id="btnEnvoyer" type="submit">Envoyer</button>
    </form>
  </main>
</div>

<!-- MENU 3 POINTS -->
<div id="menu">
  <div class="carte">
    <h2>Options <button class="fermer" data-fermer="menu">×</button></h2>
    <button class="itemMenu" data-panneau="panneauCongo">🇨🇬 Découvrir le Congo<small>Départements, lieux, plats, culture</small></button>
    <button class="itemMenu" data-panneau="panneauLingala">🗣️ Lingala<small>Phrases utiles, touche pour écouter</small></button>
    <button class="itemMenu" data-panneau="panneauMemoire">🧠 Mémoire<small>Ce que TEAk retient de toi</small></button>
    <button class="itemMenu" data-panneau="panneauReglages">⚙️ Réglages<small>Langue, voix, conversation automatique</small></button>
  </div>
</div>

<!-- CONGO -->
<div class="panneau" id="panneauCongo">
  <div class="carte">
    <h2>Découvrir le Congo <button class="fermer" data-fermer="panneauCongo">×</button></h2>
    <div id="contenuCongo"></div>
  </div>
</div>

<!-- LINGALA -->
<div class="panneau" id="panneauLingala">
  <div class="carte">
    <h2>Lingala <button class="fermer" data-fermer="panneauLingala">×</button></h2>
    <div id="contenuLingala"></div>
    <form id="ajoutPhrase">
      <input id="phraseFr" type="text" placeholder="En français…">
      <input id="phraseLn" type="text" placeholder="En lingala…">
      <button class="btnAction" type="submit">＋</button>
    </form>
  </div>
</div>

<!-- MEMOIRE -->
<div class="panneau" id="panneauMemoire">
  <div class="carte">
    <h2>Mémoire de TEAk <button class="fermer" data-fermer="panneauMemoire">×</button></h2>
    <div id="contenuMemoire"></div>
    <form id="ajoutMemoire">
      <input id="nouveauSouvenir" type="text" placeholder="Dis à TEAk de retenir quelque chose…">
      <button class="btnAction" type="submit">Retiens</button>
    </form>
    <div class="espace"></div>
    <button class="btnAction btnDanger" id="btnToutEffacer">Tout effacer</button>
  </div>
</div>

<!-- REGLAGES -->
<div class="panneau" id="panneauReglages">
  <div class="carte">
    <h2>Réglages <button class="fermer" data-fermer="panneauReglages">×</button></h2>
    <div class="ligne">Langue de TEAk<br>
      <select id="selLangue">
        <option value="mixte">Français + Lingala (congolais)</option>
        <option value="fr">Français seulement</option>
        <option value="ln">Lingala seulement</option>
      </select>
    </div>
    <div class="ligne">Voix de TEAk<br>
      <select id="selVoix">
        <option value="google">Voix Google (plus réaliste, internet requis)</option>
        <option value="appareil">Voix de l'appareil (hors-ligne)</option>
      </select>
    </div>
    <div class="ligne"><button class="btnAction" id="btnTesterVoix">Tester la voix</button></div>

for (const n of EXPR_NOMS) { const img = new Image(); img.src = EXPR_SRC[n]; EXPR[n] = img; }
document.getElementById("perso").src = EXPR_SRC["explain"];
let exprActuelle = "explain";
function setExpr(nom) {
  if (!EXPR[nom] || nom === exprActuelle) { if (nom === "listening") majPaupieres(nom); return; }
  exprActuelle = nom;
  const img = document.getElementById("perso");
  img.src = EXPR[nom].src;
  img.classList.remove("pop"); void img.offsetWidth; img.classList.add("pop");
  majPaupieres(nom);
}
function majPaupieres(nom) {
  document.getElementById("persoWrap").classList.toggle("expr-listening", nom === "listening");
}
function emotionPour(rep, demande) {
  const s = (rep || "").toLowerCase();
  if (/colère|énerv|fâch/.test(s)) return "angry";
  if (/pleur|larme/.test(s)) return "crying";
  if (/triste|désolé|décès|maladie|peine|mort/.test(s)) return "heartbroken";
  if (/amour|je t'aime|nalingi|cœur|coeur|j'adore/.test(s)) return "love";
  if (/incroyable|étonnant|wow|surpris/.test(s)) return "shocked";
  if (/saka-saka|pondu|maboké|fumbwa|makayabu|kwanga|bon appétit|à table/.test(s)) return "food";
  if (/je ne connais pas encore|apprends-la-moi/.test(s)) return "search";
  if (/félicitation|longonya|bravo|courage/.test(s)) return "strong";
  if (/haha|drôle|rire/.test(s)) return "giggle";
  if (/surpris|oh !/.test(s)) return "surprised";
  if (/merci mingi|avec plaisir|enchanté|bienvenue|boyei malamu|contente|malamu !/.test(s)) return "happy";
  if (/savais-tu|figure-toi|le savais-tu/.test(s)) return "idea";
  if (window._repli) { window._repli = false; return Math.random() < 0.5 ? "skeptical" : "explain"; }
  if (s.length > 200) return "teacher";
  return "explain";
}

let PHRASES = JSON.parse(localStorage.getItem("teak_phrases") || "null") || [
  ["Bonjour","Mbote"],["Comment ça va ?","Ndenge nini ?"],["Je vais bien","Nazali malamu"],
  ["Merci beaucoup","Mingi merci / Merci mingi"],["Bienvenue","Boyei malamu"],
  ["Comment tu t'appelles ?","Nkombo na yo nani ?"],["Je m'appelle…","Nkombo na ngai…"],
  ["Tu viens d'où ?","Owuti wapi ?"],["Je viens de Brazzaville","Nawuti Brazzaville"],
  ["Allons-y","Tokende"],["À bientôt","Kino mbala mosusu"],["Oui","Iyo"],["Non","Te"],
  ["Je t'aime","Nalingi yo"],["Bonne nuit","Butu elamu"],["Au revoir","Kende malamu"],
  ["Combien ça coûte ?","Ndenge boni ? / Talo boni ?"],["Je ne comprends pas","Nazali koyoka te"],
  ["Parle doucement","Loba malembe"],["Félicitations","Longonya"]
];

/* ============ MÉMOIRE (locale, dans l'appareil) ============ */
function souvenirs() { return JSON.parse(localStorage.getItem("teak_memoire") || "[]"); }
function retenir(texte) {
  const m = souvenirs();
  if (!m.some(s => s.texte.toLowerCase() === texte.toLowerCase())) {
    m.push({ texte, date: new Date().toLocaleDateString("fr-FR") });
    localStorage.setItem("teak_memoire", JSON.stringify(m));
  }
  afficherMemoire();
}
function oublier(i) { const m = souvenirs(); m.splice(i,1); localStorage.setItem("teak_memoire", JSON.stringify(m)); afficherMemoire(); }

/* ============ VOIX : jeune femme ============ */
let voixChoisie = null;
function chargerVoix() {
  const voix = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang));
  const pref = ["Léa","Marie","Amélie","Audrey","Aurélie","Virginie","Julie","Céline","Siri","female","femme","Google français"];
  voixChoisie = null;
  for (const nom of pref) { const v = voix.find(v => v.name.toLowerCase().includes(nom.toLowerCase())); if (v) { voixChoisie = v; break; } }
  if (!voixChoisie) voixChoisie = voix[0] || null;
}
if ("speechSynthesis" in window) { chargerVoix(); speechSynthesis.onvoiceschanged = chargerVoix; }

let conversationActive = false;
function setStatut(t) { document.getElementById("statutTexte").textContent = t; }
function setEtatBouton(t) { document.getElementById("etatBouton").textContent = t; }
let audioEnCours = null;
function modeVoix() { return localStorage.getItem("teak_voix") || "google"; }
function arreterParole() {
  if (audioEnCours) { try { audioEnCours.pause(); } catch(e) {} audioEnCours = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function decouperTexte(t) {
  const morceaux = []; let reste = t;
  while (reste.length > 180) {
    let coupe = Math.max(reste.lastIndexOf(". ", 180), reste.lastIndexOf("! ", 180), reste.lastIndexOf("? ", 180), reste.lastIndexOf(", ", 180));
    if (coupe < 60) coupe = 180;
    morceaux.push(reste.slice(0, coupe + 1).trim()); reste = reste.slice(coupe + 1).trim();
  }
  if (reste) morceaux.push(reste);
  return morceaux;
}
function parler(texte, suite) {
  document.body.className = "parle";
  setStatut("TEAk parle…"); setEtatBouton("TEAk parle…");
  arreterParole();
  let fini = false;
  const terminer = () => { if (fini) return; fini = true; audioEnCours = null; document.body.className = ""; setEtatBouton(conversationActive ? "À toi de parler…" : "Touche pour parler"); if (suite) suite(); };
  setTimeout(terminer, Math.max(9000, texte.length * 200)); /* filet de sécurité */
  if (modeVoix() === "google") {
    const morceaux = decouperTexte(texte);
    let i = 0;
    const jouer = () => {
      if (fini) return;
      if (i >= morceaux.length) { terminer(); return; }
      const a = new Audio("https://translate.google.com/translate_tts?ie=UTF-8&tl=fr&client=tw-ob&q=" + encodeURIComponent(morceaux[i]));
      audioEnCours = a;
      a.onended = () => { i++; jouer(); };
      a.onerror = () => { if (!fini) parlerAppareil(texte, terminer); };
      const pr = a.play(); if (pr && pr.catch) pr.catch(() => { if (!fini) parlerAppareil(texte, terminer); });
    };
    jouer();
  } else {
    parlerAppareil(texte, terminer);
  }
}
function parlerAppareil(texte, terminer) {
  if (!("speechSynthesis" in window)) { terminer(); return; }
  const u = new SpeechSynthesisUtterance(texte);
  u.lang = "fr-FR"; if (voixChoisie) u.voice = voixChoisie;
  u.pitch = 1.12; u.rate = 1.0;
  u.onend = terminer; u.onerror = terminer;
  speechSynthesis.speak(u);
}

/* ============ CARTE INFO : montre (heure) / calendrier (date) ============ */
function majCarteInfo(texte) {
  const s = texte.toLowerCase();
  if (/heure/.test(s)) afficherCarte("heure");
  else if (/date|quel jour|aujourd'hui/.test(s)) afficherCarte("date");
  else masquerCarte();
}
function afficherCarte(type) {
  const now = new Date();
  const img = document.getElementById("carteImg");
  const jour = document.getElementById("carteJour");
  if (type === "heure") {
    img.src = MONTRE_SRC; jour.style.display = "none";
    document.getElementById("carteTitre").textContent = now.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
    document.getElementById("carteSous").textContent = now.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
  } else {
    img.src = CAL_SRC; jour.style.display = "block"; jour.textContent = now.getDate();
    document.getElementById("carteTitre").textContent = now.toLocaleDateString("fr-FR", {weekday:"long"});
    document.getElementById("carteSous").textContent = now.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
  }
  document.getElementById("carteInfo").classList.add("actif");
  clearTimeout(window._carteTimer);
  window._carteTimer = setTimeout(masquerCarte, 8000);
}
function masquerCarte() { document.getElementById("carteInfo").classList.remove("actif"); }

/* ============ RECHERCHE WEB (Wikipédia, DuckDuckGo) ============ */
function estQuestionWeb(t) {
  const s = t.toLowerCase().trim();
  return /\?/.test(t) || /^(qui|que|quel|quelle|quels|quelles|comment|pourquoi|quand|où|combien|est-ce|c'est quoi|dis-moi|parle-moi de|raconte|cherche)/.test(s);
}
function afficherSources(sources) {
  const z = document.getElementById("sources");
  if (!sources.length) { masquerSources(); return; }
  z.innerHTML = "<span class='srcLabel'>📚 Trouvé sur :</span>" + sources.map(x => "<a href='" + x[1] + "' target='_blank' rel='noopener'>" + x[0] + "</a>").join("");
  z.classList.add("actif");
}
function masquerSources() { const z = document.getElementById("sources"); z.classList.remove("actif"); z.innerHTML = ""; }
async function chercherWeb(texte) {
  setExpr("search"); setStatut("TEAk cherche sur le web…"); setEtatBouton("TEAk cherche…");
  document.getElementById("transcription").textContent = "Je cherche sur le web…";
  const q = encodeURIComponent(texte);
  let rep = "", sources = [];
  try {
    const r = await fetch("https://api.duckduckgo.com/?q=" + q + "&format=json&no_html=1&skip_disambig=1");
    const d = await r.json();
    if (d.AbstractText) { rep = d.AbstractText; sources.push([d.AbstractSource || "DuckDuckGo", d.AbstractURL || ("https://duckduckgo.com/?q=" + q)]); }
  } catch(e) {}
  if (!rep) {
    try {
      const r2 = await fetch("https://fr.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&generator=search&gsrsearch=" + q + "&gsrlimit=3&format=json&origin=*");
      const d2 = await r2.json();
      const pages = (d2.query && d2.query.pages) ? Object.values(d2.query.pages) : [];
      pages.sort((a,b) => (a.index||0) - (b.index||0));
      if (pages.length && pages[0].extract) {
        rep = pages[0].extract.replace(/\s+/g, " ").slice(0, 520);
        const coupe = rep.lastIndexOf(". "); if (coupe > 200) rep = rep.slice(0, coupe + 1);
        for (const pg of pages) sources.push(["Wikipédia", "https://fr.wikipedia.org/wiki/" + encodeURIComponent(pg.title.replace(/ /g, "_"))]);
      }
    } catch(e) {}
  }
  const apres = () => { if (conversationActive) setTimeout(ecouter, 350); else { setExpr("explain"); setStatut("TEAk est prête"); } };
  if (!rep) {
    masquerSources();
    const sec = "Je n'ai rien trouvé de sûr sur le web pour ça. Reformule ta question, ou demande-moi quelque chose sur le Congo, le pays, je le connais bien !";
    document.getElementById("transcription").textContent = sec;
    setExpr("skeptical");
    parler(sec, apres);
    return;
  }
  afficherSources(sources);
  document.getElementById("transcription").textContent = rep;
  setExpr("teacher");
  parler(rep, apres);
}

/* ============ ÉCOUTE ============ */
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
let reco = null;
function ecouter() {
  if (!conversationActive) return;
  if (!Reco) { setStatut("Micro non pris en charge ici — écris plutôt"); document.getElementById("zoneTexte").classList.add("actif"); conversationActive = false; setExpr("explain"); return; }
  reco = new Reco();
  reco.lang = "fr-FR"; reco.interimResults = false; reco.maxAlternatives = 1;
  document.body.className = "ecoute"; setStatut("TEAk t'écoute…"); setEtatBouton("À toi de parler…");
  setExpr("listening");
  document.getElementById("invite").textContent = "Je t'écoute…";
  reco.onresult = (e) => {
    const texte = e.results[0][0].transcript.trim();
    document.getElementById("transcription").textContent = "« " + texte + " »";
    document.body.className = "";
    setExpr(/s'il te pla|je t'en prie|stp/.test(texte.toLowerCase()) ? "pray" : "thinking");
    setEtatBouton("TEAk réfléchit…");
    setTimeout(() => repondre(texte), 550);
  };
  reco.onerror = () => { document.body.className = ""; if (conversationActive) setTimeout(ecouter, 1200); };
  reco.onend = () => { if (document.body.className === "ecoute") document.body.className = ""; };
  try { reco.start(); } catch(e) { setTimeout(ecouter, 1000); }
}

/* ============ CERVEAU LOCAL ============ */
function langue() { return localStorage.getItem("teak_langue") || "mixte"; }
function reponse(t) {
  const s = t.toLowerCase();
  const mem = souvenirs().map(x => x.texte);
  const nomMem = mem.find(x => /appelle/i.test(x));
  let m;
  if ((m = t.match(/je m'appelle\s+(.+)/i))) { retenir("Il/elle s'appelle " + m[1].trim()); return repondreNom(m[1].trim()); }
  if ((m = t.match(/j'habite\s+(?:à|a|au|en)?\s*(.+)/i))) { retenir("Il/elle habite " + m[1].trim()); return "Malamu ! Je retiens que tu habites " + m[1].trim() + ". Je m'en souviendrai."; }
  if ((m = t.match(/j'aime\s+(.+)/i))) { retenir("Il/elle aime " + m[1].trim()); return "Noté dans ma mémoire : tu aimes " + m[1].trim() + ". Merci de me l'avoir dit !"; }
  if (/retiens|retient|n'oublie pas|souviens/.test(s)) { retenir(t); return "C'est noté dans ma mémoire, je ne l'oublierai pas."; }
  if (/mon nom|je m'appelle comment|comment je m'appelle/.test(s)) return nomMem ? "Bien sûr que je m'en souviens : " + nomMem.replace("Il/elle s'appelle ","tu t'appelles ") + "." : "Tu ne me l'as pas encore dit. Dis-moi : je m'appelle, et ton prénom, et je le retiendrai.";
  if (/tu te souviens|souvenirs|ta mémoire|que sais-tu de moi/.test(s)) return mem.length ? "Voici ce que je retiens de toi : " + mem.join(" ; ") + "." : "Pour l'instant je ne sais encore rien de toi. Dis-moi ton prénom, ta ville, ce que tu aimes, et je le retiendrai.";
  if (/^(mbote|bonjour|bonsoir|salut|hello)/.test(s)) return langue() === "fr" ? "Bonjour ! Je suis TEAk, ton agente du Congo. De quoi veux-tu parler : du pays, du lingala, ou de toi ?" : "Mbote ! Nazali TEAk, agente na yo ya Congo. Olengi tosolola na nini : mboka, lingala, to yo moko ?";
  if (/ndenge nini|comment (ça va|vas-tu|allez)/.test(s)) return "Nazali malamu, merci ! Je vais très bien. Et toi, ndenge nini ?";
  if (/qui es-tu|ton nom|tu t'appelles|présente/.test(s)) return "Je suis TEAk, une agente intelligente congolaise. Je parle français et lingala, je connais tout le Congo Brazzaville, et je retiens ce qu'on me confie. Mbote na yo !";
  if (/quel âge|ton âge/.test(s)) return "Je suis une intelligence artificielle, je n'ai pas d'âge, mais ma voix est celle d'une jeune femme, comme on m'a créée.";
  if (/capitale/.test(s) && /économ/.test(s)) return "La capitale économique, c'est Pointe-Noire : le grand port sur l'océan Atlantique et le cœur du pétrole congolais.";
  if (/capitale/.test(s)) return "La capitale du Congo Brazzaville, c'est Brazzaville, sur la rive droite du fleuve Congo, face à Kinshasa.";
  if (/département/.test(s)) return "Le Congo compte aujourd'hui 15 départements. Les principaux : " + DEPARTEMENTS.map(d => d[0]).join(", ") + ". Demande-moi un département précis et je te le présente.";
  for (const [nom, desc] of DEPARTEMENTS) if (s.includes(nom.toLowerCase().replace("ô","o")) || s.includes(nom.toLowerCase())) return nom + " : " + desc + ".";
  if (/odzala/.test(s)) return LIEUX[0][0] + " : " + LIEUX[0][1];
  if (/nouabal/.test(s)) return LIEUX[1][0] + " : " + LIEUX[1][1];
  if (/fleuve|congo \(fleuve\)/.test(s)) return LIEUX[2][1];
  if (/gorille/.test(s)) return "Le Congo est un grand pays de gorilles des plaines : on les observe à Odzala-Kokoua, à Nouabalé-Ndoki, et près de Brazzaville à la réserve de Lesio-Louna.";
  if (/sape|sapeur/.test(s)) return "La Sape, la Société des Ambianceurs et des Personnes Élégantes ! Née à Brazzaville, dans les quartiers comme Bacongo, c'est l'art de s'habiller avec une élégance incroyable. La rumba et la sape, c'est l'âme de Brazza.";
  if (/rumba|musique/.test(s)) return "La rumba congolaise est inscrite au patrimoine de l'UNESCO depuis 2021. De Brazzaville, elle a fait danser toute l'Afrique. Longonya !";
  if (/plat|manger|cuisine|nourriture/.test(s)) return "À table ! Les plats du pays : " + PLATS.map(p => p[0] + " (" + p[1] + ")").join(" ; ") + ". Bon appétit, kolia malamu !";
  for (const [nom, desc] of PLATS) if (s.includes(nom.toLowerCase())) return nom + " : " + desc;
  if (/pointe-noire|pointe noire/.test(s)) return "Pointe-Noire, la capitale économique : le port, les plages de la Côte Sauvage, la Diosso et ses gorges rouges, et le pétrole offshore.";
  if (/brazzaville|brazza/.test(s)) return "Brazzaville, la capitale, fondée en 1880 : la basilique Sainte-Anne, la Case de Gaulle, les rapides du fleuve, le marché Total à Bacongo et les sapeurs. C'est chez nous !";
  if ((m = s.match(/comment (?:on )?dit (.+) en lingala/)) || (m = s.match(/traduis (.+)/))) {
    const cherche = m[1].replace(/[?.]/g,"").trim();
    const trouve = PHRASES.find(p => p[0].toLowerCase().includes(cherche) || cherche.includes(p[0].toLowerCase().replace(/…/g,"").trim()));
    if (trouve) return "« " + trouve[0] + " » en lingala, on dit : " + trouve[1] + ". Répète après moi !";
    return "Je ne connais pas encore cette phrase en lingala. Apprends-la-moi dans le menu Lingala, avec les 3 points en haut à droite, et je la retiendrai pour toujours.";
  }
  if (/lingala/.test(s)) return "Le lingala est la grande langue du fleuve, parlée à Brazzaville et dans tout le nord du pays. Quelques mots : Mbote = bonjour, Ndenge nini = comment ça va, Merci mingi = merci beaucoup. Ouvre le lexique avec les 3 points pour apprendre et écouter 20 phrases.";
  if (/mbote/.test(s)) return "Mbote na yo ! Bonjour à toi. Ndenge nini, comment ça va ?";
  if (/merci/.test(s)) return "Merci mingi ! Avec plaisir. Je suis là pour toi.";
  if (/au revoir|à bientôt|bonne nuit/.test(s)) { conversationActive = false; return "Kende malamu, au revoir ! Touche le bouton quand tu veux me reparler."; }
  if (/heure/.test(s)) return "Il est " + new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) + ".";
  if (/aujourd'hui|quel jour/.test(s)) return "Nous sommes le " + new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + ".";
  window._repli = true;
  return choix([
    "Je t'écoute. Parle-moi du Congo, demande-moi un mot en lingala, ou dis-moi quelque chose sur toi pour que je le retienne.",
    "Malamu, je suis là. Tu peux me demander la capitale, les départements, les parcs, les plats du pays, ou un mot en lingala.",
    "D'accord. Continue, je t'écoute, et je retiens ce qui compte pour toi."
  ]);
}
function repondreNom(nom) { return "Enchantée, " + nom + " ! Boyei malamu, bienvenue. Je retiens ton prénom."; }
function choix(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function repondre(texte) {
  const rep = reponse(texte);
  const repliLocal = window._repli; window._repli = false;
  majCarteInfo(texte);
  if (repliLocal && estQuestionWeb(texte)) { chercherWeb(texte); return; }
  window._repli = repliLocal;
  masquerSources();
  document.getElementById("transcription").textContent = rep;
  setExpr(emotionPour(rep, texte));
  parler(rep, () => { if (conversationActive) setTimeout(ecouter, 350); else { setExpr("explain"); setStatut("TEAk est prête"); } });
}

/* ============ CONVERSATION AUTOMATIQUE (petit bouton) ============ */
document.getElementById("btnParole").addEventListener("click", () => {

    conversationActive = false;
    if (reco) try { reco.stop(); } catch(e) {}

    setStatut("TEAk est prête"); setEtatBouton("Touche pour parler");

  }
  conversationActive = true;
  document.getElementById("invite").textContent = "Conversation en cours — touche le bouton pour arrêter";

  const salut = nomMem
    ? "Mbote " + nomMem.replace("Il/elle s'appelle ","") + " ! Contente de te reparler. Ndenge nini ?"
    : "Mbote ! Je suis TEAk, ton agente congolaise. Comment tu t'appelles, et de quoi veux-tu qu'on parle ?";
  document.getElementById("transcription").textContent = salut;
  setExpr("happy");
  parler(salut, () => setTimeout(ecouter, 350));
});
